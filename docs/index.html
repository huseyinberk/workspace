<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hüseyin Berk'in backend engineering, distributed systems ve veri altyapıları üzerine teknik notları." />
  <title>Hüseyin Berk · Engineering Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root { --theme-color: #0f766e; --sidebar-width: 280px; }
    body { color: #1f2937; }
    .sidebar { border-right: 1px solid #e5e7eb; padding-top: 1.25rem; }
    .sidebar-nav > ul > li > p { color: #111827; font-weight: 700; letter-spacing: .02em; }
    .sidebar a { color: #4b5563; }
    .sidebar a:hover, .sidebar li.active > a { color: var(--theme-color); }
    .app-nav a { color: #0f766e; }
    .markdown-section { max-width: 900px; padding: 3rem 2.5rem 5rem; }
    .markdown-section h1 { color: #111827; font-size: 2.35rem; letter-spacing: -.04em; }
    .markdown-section h2 { margin-top: 2.5rem; color: #111827; }
    .markdown-section a { color: #0f766e; }
    .search .results-panel { border-radius: 8px; }
    @media screen and (max-width: 768px) {
      .markdown-section { padding: 2rem 1.25rem 4rem; }
      .markdown-section h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>
  <div id="app">Yükleniyor…</div>
  <script>
    window.$docsify = {
      name: 'Hüseyin Berk',
      repo: 'huseyinberk/workspace',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Yazılarda ara',
        noData: 'Sonuç bulunamadı.',
        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
