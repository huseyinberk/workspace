<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A personal record of things learned while building software." />
  <title>Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --page: #181c1f;
      --surface: #1e2124;
      --surface-hover: #252a2e;
      --text: #d4d4d4;
      --heading: #ffffff;
      --muted: #a2a9b9;
      --border: #30363d;
      --accent: #99daff;
      --link: #f76a8d;
      --code: #121517;
      --sidebar-width: 270px;
    }

    * { box-sizing: border-box; }
    html, body, #app { min-height: 100%; }
    body {
      background: var(--page);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.75;
    }

    .sidebar {
      background: var(--page);
      border-right: 1px solid var(--border);
      color: var(--text);
      padding: 24px 16px 36px;
      width: var(--sidebar-width);
    }

    .sidebar .app-name {
      border-bottom: 1px solid var(--border);
      margin: 0 0 18px;
      padding: 0 4px 17px;
    }

    .sidebar .app-name-link {
      color: var(--heading);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.04em;
    }

    .sidebar .app-name-link::before {
      color: var(--accent);
      content: "/// ";
    }

    .sidebar-nav { margin: 0; }
    .sidebar-nav ul, .sidebar-nav li { margin: 0; }
    .sidebar-nav ul { padding-left: 0; }
    .sidebar-nav li { line-height: 1.45; }

    .sidebar a,
    .sidebar strong,
    .sidebar-nav > ul > li > p {
      border-radius: 5px;
      color: var(--muted);
      display: block;
      font-size: 12px;
      padding: 6px 8px;
    }

    .sidebar strong,
    .sidebar-nav > ul > li > p { color: var(--text); font-weight: 700; }

    .sidebar li ul {
      border-left: 1px solid var(--border);
      margin: 3px 0 6px 10px;
      padding-left: 8px;
    }

    .sidebar a:hover,
    .sidebar li.active > a {
      background: var(--surface);
      color: var(--link);
      font-weight: 500;
      text-decoration: none;
    }

    .sidebar-nav hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 18px 8px;
    }

    .search {
      border-bottom: 1px solid var(--border);
      margin: 0 0 18px;
      padding: 0 4px 18px;
    }

    .search input {
      background: var(--surface);
      border: 1px solid var(--border) !important;
      border-radius: 5px;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      outline: none;
      padding: 9px 10px;
    }

    .search input:focus { border-color: var(--accent) !important; }
    .search .results-panel {
      background: var(--surface);
      border-color: var(--border);
      border-radius: 5px;
    }

    .content {
      background: var(--page);
      left: var(--sidebar-width);
    }

    .markdown-section {
      color: var(--text);
      font-size: 14px;
      line-height: 1.85;
      margin: 0;
      max-width: 940px;
      padding: 54px 72px 96px;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: var(--heading);
      font-weight: 700;
      letter-spacing: -.045em;
    }

    .markdown-section h1 {
      font-size: 32px;
      line-height: 1.2;
      margin: 0 0 24px;
    }

    .markdown-section h2 {
      border: 0;
      font-size: 19px;
      line-height: 1.35;
      margin: 50px 0 20px;
      padding: 0 0 0 18px;
      position: relative;
    }

    .markdown-section h2::before {
      background: var(--accent);
      bottom: 2px;
      content: "";
      left: 0;
      position: absolute;
      top: 2px;
      width: 5px;
    }

    .markdown-section h3 {
      font-size: 15px;
      margin-top: 34px;
    }

    .markdown-section a { color: var(--link); font-weight: 500; }
    .markdown-section a:hover { color: #f5bfcd; text-decoration: none; }

    .markdown-section blockquote {
      background: var(--surface);
      border: 0;
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      color: var(--text);
      margin: 28px 0;
      padding: 13px 20px;
    }

    .markdown-section blockquote p { margin: 0; }
    .markdown-section hr { border-color: var(--border); }

    .markdown-section code,
    .markdown-section pre,
    .markdown-section pre code {
      font-family: inherit;
    }

    .markdown-section :not(pre) > code {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--accent);
      font-size: .88em;
      padding: .12em .35em;
    }

    .markdown-section pre {
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px 20px;
    }

    .markdown-section pre code {
      color: var(--text);
      font-size: 12px;
      line-height: 1.7;
    }

    .markdown-section table {
      border-collapse: collapse;
      display: table;
      width: 100%;
    }

    .markdown-section table tr,
    .markdown-section table tr:nth-child(2n) { background: transparent; }

    .markdown-section table td,
    .markdown-section table th {
      border-color: var(--border);
      padding: 10px 12px;
    }

    .markdown-section table th {
      background: var(--surface);
      color: var(--heading);
      font-weight: 700;
    }

    .note-meta {
      color: var(--muted);
      font-size: 11px;
      margin: -15px 0 24px;
    }

    .note-list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text) !important;
      display: grid;
      gap: 4px;
      padding: 16px 18px;
      text-decoration: none;
      transition: background .16s ease, border-color .16s ease;
    }

    .note-card:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      text-decoration: none;
    }

    .note-card-title {
      color: var(--heading);
      font-size: 14px;
      font-weight: 700;
    }

    .note-card-date { color: var(--accent); font-size: 11px; }
    .note-card-summary { color: var(--muted); font-size: 12px; line-height: 1.65; }

    .sidebar-toggle {
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-top: 1px solid var(--border);
      border-radius: 0 6px 0 0;
    }

    .sidebar-toggle span { background-color: var(--accent); }

    @media screen and (min-width: 769px) {
      .sidebar { left: max(0px, calc((100vw - 1640px) / 2)); }
      .content { left: max(var(--sidebar-width), calc((100vw - 1640px) / 2 + var(--sidebar-width))); }
    }

    @media screen and (max-width: 768px) {
      .markdown-section { padding: 40px 24px 72px; }
      .markdown-section h1 { font-size: 27px; }
      .sidebar { padding-top: 20px; }
    }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'Workspace',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      search: {
        placeholder: 'Search notes',
        noData: 'No results found.',
        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
